name: 🤫 Sync whisper.cpp

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override the latest tag (optional)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * *'

# GITHUB_TOKEN is enough to push. A personal PAT is not required.
# Pushes made with GITHUB_TOKEN do not trigger other "on: push" workflows,
# so we explicitly dispatch the Docker Images workflow after a successful push.
permissions:
  contents: write
  actions: write

jobs:
  sync-by-tag:
    name: 🏷️ Sync Repository by Latest Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🏷️ Determine the tag to use
        id: tag
        run: |
          if [[ -z "${{ github.event.inputs.tag_override }}" ]]; then
            LATEST_TAG=$(git ls-remote --tags --sort="v:refname" https://github.com/ggerganov/whisper.cpp.git \
              | grep -v '\^{}' \
              | tail -n1 \
              | sed 's/.*refs\/tags\///')
          else
            LATEST_TAG="${{ github.event.inputs.tag_override }}"
          fi
          echo "Latest tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: 📦 Snapshot wrapper from main (exclude whisper)
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper"
          rsync -a --exclude '.git' --exclude 'src/whisper' ./ "$RUNNER_TEMP/wrapper/"

      - name: 🔀 Create/Checkout the branch by tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Latest Branch Name: $TAG"
          if git ls-remote --exit-code --heads origin "$TAG"; then
            echo "Branch found in remote, checking out."
            git checkout -B "$TAG" "origin/$TAG"
          else
            echo "Branch not found in remote, creating a new one from origin/main."
            git checkout -B "$TAG" origin/main
          fi

      - name: 🔄 Replace tree with wrapper + tagged whisper.cpp
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a "$RUNNER_TEMP/wrapper/" ./
          rm -rf src/whisper
          git clone --branch "$TAG" --depth 1 https://github.com/ggerganov/whisper.cpp.git src/whisper
          rm -rf src/whisper/.git src/whisper/.devops src/whisper/.github src/whisper/docs src/whisper/samples
          rm -f src/whisper/LICENSE src/whisper/AUTHORS src/whisper/.gitignore src/whisper/.gitmodules
          find src/whisper -name '*.md' -delete

      - name: 💾 Commit and push changes
        id: push
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --all
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit 🛑"
          else
            git commit -m "Sync with whisper.cpp $TAG 🚀"
            git push --set-upstream origin "$TAG"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐳 Trigger Docker image build
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-docker.yml --ref "${{ steps.tag.outputs.tag }}"

  sync-latest-commit:
    name: 🔄 Sync Repository with Latest Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: 🔄 Sync whisper.cpp repository to src/whisper
        run: |
          mkdir -p src
          rm -rf src/whisper
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git src/whisper
          rm -rf src/whisper/.git src/whisper/.devops src/whisper/.github src/whisper/docs src/whisper/samples
          rm -f src/whisper/LICENSE src/whisper/AUTHORS src/whisper/.gitignore src/whisper/.gitmodules
          find src/whisper -name "*.md" -delete

      - name: 💾 Commit and push sync changes
        id: push
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/whisper
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit 🛑"
          else
            git commit -m "Sync with whisper.cpp 🚀"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐳 Trigger Docker image build
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-docker.yml --ref main
